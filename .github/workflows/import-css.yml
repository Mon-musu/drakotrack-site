name: import-css

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download index.html and styles.css
        run: |
          set -euo pipefail
          BASE="https://rxamdcgcpjzfeygxeukj.supabase.co/storage/v1/object/public/drakotrack-import"
          for f in index.html styles.css; do
            curl -fsSL "$BASE/$f?cb=$GITHUB_RUN_ID" -o "$f"
          done
          sha256sum index.html styles.css

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "drakotrack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Raise contrast of danger buttons and form-control borders; mark auth screen as main"
            git push
          fi
