name: APK release

# Push a tag like `apk-1.4` to build, sign and attach the sideload APK.
# The tag name is the version name; versionCode is the current
# apk-version.json value + 1, so every release still installs in place over the
# previous one. See RELEASE.md for the one-time secret setup.

on:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Read the version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#apk-}"
          case "$version" in
            [0-9].[0-9]) ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} must look like apk-<major>.<minor>, for example apk-1.4"
              exit 1
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools
        run: |
          set -euo pipefail
          tools="$HOME/tools"
          mkdir -p "$tools/bt"
          curl -fsSL -o "$tools/bt.zip" https://dl.google.com/android/repository/build-tools_r35_linux.zip
          unzip -q "$tools/bt.zip" -d "$tools/bt"
          src=$(dirname "$(find "$tools/bt" -name apksigner -type f -print -quit)")
          [ -n "$src" ] || { echo "::error::the build-tools archive had no apksigner"; exit 1; }
          mv "$src" "$tools/build-tools"
          chmod +x "$tools"/build-tools/*
          "$tools/build-tools/apksigner" --version

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secrets APK_KEYSTORE_BASE64 / APK_KEYSTORE_PASSWORD. Add them once (see RELEASE.md) and re-run this job."
            exit 1
          fi
          mkdir -p apk-build/keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > apk-build/keys/drakotrack-sideload.jks
          # Fails here with a clear message if the password does not match the key.
          keytool -list -keystore apk-build/keys/drakotrack-sideload.jks \
            -storepass "$KEYSTORE_PASSWORD" > /dev/null

      - name: Build, sign and attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: github
          VERSION_NAME: ${{ env.VERSION }}
          STOREPASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: ./release-apk.sh

      - name: Commit the new feed to main
        run: |
          set -euo pipefail
          code=$(python3 -c 'import json; print(json.load(open("apk/version.json"))["versionCode"])')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/version.json apk-version.json
          if git diff --cached --quiet; then
            echo "version state already matched; nothing to commit"
          else
            git commit -m "Release APK ${VERSION} (build ${code})"
            if ! git push origin HEAD:main; then
              echo "::error::the release was published but main could not be fast-forwarded; commit apk/version.json and apk-version.json by hand so the next tag does not reuse build ${code}"
              exit 1
            fi
          fi

      - name: Summary
        run: |
          {
            echo "### APK ${VERSION}"
            echo
            echo '```json'
            cat apk/version.json
            echo '```'
            echo
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/apk-${VERSION}"
            echo
            echo "If Vercel does not auto-deploy from git, deploy the site so the live feed picks this up."
          } >> "$GITHUB_STEP_SUMMARY"
