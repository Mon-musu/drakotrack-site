name: import-shell
on: {workflow_dispatch: }
permissions: {contents: write}
jobs:
  imp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          set -e
          SB=https://rxamdcgcpjzfeygxeukj.supabase.co/storage/v1/object/public/drakotrack-import
          for f in app.js index.html; do curl -sfL "$SB/$f" -o "$f"; done
      - name: verify
        run: |
          set -e
          sha256sum -c <<'EOF'
          c83eb2e4defcbb210f885432c80addcf1166eae6ed7586a73712de638219bd3f  app.js
          73f1b5c6d18a655a4f208e5d36551bbeb5c179dd16b1508e6e11a18fce603771  index.html
          EOF
      - name: commit
        run: |
          set -e
          git config user.name import-shell
          git config user.email import-shell@users.noreply.github.com
          git add app.js index.html
          git diff --cached --quiet || { git commit -m "App shell v12: cloud-first signup + bi-weekly backup reminder"; git push; }
