name: import-shell
on: {workflow_dispatch: }
permissions: {contents: write}
jobs:
  imp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          set -e
          SB=https://rxamdcgcpjzfeygxeukj.supabase.co/storage/v1/object/public/drakotrack-import
          for f in app.js styles.css supabase.js boostcamp.js share.js logo.png; do curl -sfL "$SB/$f" -o "$f"; done
      - name: verify
        run: |
          set -e
          sha256sum -c <<'EOF'
          ff9cfc58a3ae8579675f857f802809f0585c3cc3fe2d690d76a4dfbcca5f3d76  app.js
          683deac4969102d12e72109460a7ad979bf38cd2d085cf6afa5be4a874c88d83  styles.css
          3fe67f9c9a794ae4a8966ec849a5f00213359c48f58ee2d5eeafdeb0f1af3c25  supabase.js
          9145507f3d89de1f8d88ab08cbe446dca4e28d767719733b54990ee7a647b3e0  boostcamp.js
          5efe650e59a6b133997573abe5f7b86cc978ff706eb7e4db63fd331fd6415e60  share.js
          11f9971845641ce6970bf906d2534ed8d447153202db024d780b99488b306e09  logo.png
          EOF
      - name: commit
        run: |
          set -e
          git config user.name import-shell
          git config user.email import-shell@users.noreply.github.com
          git add app.js styles.css supabase.js boostcamp.js share.js logo.png
          git diff --cached --quiet || { git commit -m "Import app shell (scripts, styles, logo) onto Vercel assets"; git push; }
