name: import-shell

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download site shell from mirror
        run: |
          set -euo pipefail
          BASE="https://rxamdcgcpjzfeygxeukj.supabase.co/storage/v1/object/public/drakotrack-import"
          for f in index.html app.js styles.css supabase.js legal.html legal.js; do
            curl -fsSL "$BASE/$f?cb=$GITHUB_RUN_ID" -o "$f"
          done
          sha256sum index.html app.js styles.css supabase.js legal.html legal.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "drakotrack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html app.js styles.css supabase.js legal.html legal.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add legal pages, consent, data deletion and accessibility fixes"
            git push
          fi
