name: deploy-vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_NAME: drakotrack
  VERCEL_SCOPE: monmusu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Diagnóstico del token
        run: |
          node -e '
            const raw = process.env.VERCEL_TOKEN || "";
            const clean = raw.replace(/\s+/g, "").replace(/^["\x27]|["\x27]$/g, "");
            let kind = "desconocido";
            if (/^sb_secret_/.test(raw)) kind = "clave secreta de Supabase";
            else if (/^sb_publishable_/.test(raw)) kind = "clave publicable de Supabase";
            else if (/^eyJ/.test(raw)) kind = "JWT (clave anon/service de Supabase u otro token)";
            else if (/^https?:/.test(raw)) kind = "URL";
            else if (/^(gh[pousr]_|github_pat_)/.test(raw)) kind = "token de GitHub";
            else if (/^[A-Za-z0-9]{20,30}$/.test(clean)) kind = "posible token de Vercel";
            console.log("longitud:", raw.length, "| solo alfanumérico:", /^[A-Za-z0-9]+$/.test(clean), "| tipo:", kind);
            if (!clean) process.exit(1);
          '

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vincular el proyecto
        run: |
          TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]' | sed 's/^["\x27]//; s/["\x27]$//')
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Usando VERCEL_ORG_ID y VERCEL_PROJECT_ID de la configuración."
          else
            vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$TOKEN"
          fi

      - name: Desplegar a producción
        run: |
          TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]' | sed 's/^["\x27]//; s/["\x27]$//')
          vercel deploy --prod --yes --token "$TOKEN"

      - name: Resumen
        run: echo "Desplegado el commit ${GITHUB_SHA} en producción (https://drakotrack.vercel.app)."
