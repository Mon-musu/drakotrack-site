name: apply-redesign
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip-redesign]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Descargar archivos
        run: |
          curl -fsSL -o app.js https://n.uguu.se/qCOcGyGYMeSY.js
          curl -fsSL -o styles.css https://d.uguu.se/JsWOvecuYcmf.css
          curl -fsSL -o sw.js https://n.uguu.se/jJhhppmEODVm.js
          curl -fsSL -o test-design.js https://d.uguu.se/azWkjCCAfUDj.js
      - name: Parchear index.html
        run: |
          python3 - <<'PY'
          p='index.html'; s=open(p).read()
          sym='<symbol id="dt-icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>'
          assert sym in s
          s=s.replace(sym, sym+'<symbol id="dt-icon-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>')
          old='<button class="nav-btn active" data-action="tab" data-route="workouts" aria-current="page"><svg class="nav-icon" aria-hidden="true"><use href="#dt-icon-dumbbell"/></svg><span>Entrenamientos</span></button>'
          assert s.count(old)==2
          home='<button class="nav-btn active" data-action="tab" data-route="home" aria-current="page"><svg class="nav-icon" aria-hidden="true"><use href="#dt-icon-home"/></svg><span>Inicio</span></button>\n    '
          s=s.replace(old, home+old.replace(' active','').replace(' aria-current="page"',''))
          s=s.replace('styles.css?v=45','styles.css?v=46').replace('app.js?v=65','app.js?v=66')
          open(p,'w').write(s)
          PY
      - name: Probar
        run: npm ci --no-audit --no-fund && npm test
      - name: Publicar
        run: |
          git config user.name DrakoTrack
          git config user.email bot@drakotrack.local
          rm .github/workflows/apply-redesign.yml
          git add -A
          git commit -m "Rediseño: panel de Inicio con constancia, volumen y récords [skip-redesign]"
          git push