<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex">
<title>DrakoTrack — Sin conexión</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0c;color:#f5f5f6;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  main{max-width:420px;text-align:center;background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:1.35rem;margin:12px 0 6px}
  p{color:#b9b9c2;font-size:.95rem;line-height:1.5;margin:8px 0}
  a.btn{display:inline-block;margin-top:14px;padding:11px 18px;border-radius:12px;background:#ff7a00;color:#111;font-weight:700;text-decoration:none}
  .hint{font-size:.78rem;color:#9c9ca6}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="DrakoTrack">
  <h1>Sin conexión</h1>
  <p>DrakoTrack no pudo abrir la aplicación desde la caché. Tus entrenamientos siguen guardados en este dispositivo y no se pierden.</p>
  <p class="hint">Comprueba la conexión y vuelve a intentarlo. Si ya habías abierto la app antes, el inicio normal funciona sin Internet.</p>
  <a class="btn" href="./">Reintentar</a>
</main>
</body>
</html>
