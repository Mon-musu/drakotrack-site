name = "drakotrack"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# Un despliegue, dos formas de proyecto en Cloudflare:
#   * Workers Builds ejecuta `wrangler deploy`  -> usa `main` + [assets].
#   * Cloudflare Pages ejecuta `wrangler pages deploy dist` -> usa
#     pages_build_output_dir.
# Ambas entradas llaman al mismo adaptador (functions/api/[[path]].js), así que
# la API, las cookies y las validaciones son idénticas en las dos.
main = "worker.js"
pages_build_output_dir = "./dist"

[assets]
# Binding explícito (no puede llamarse ASSETS: está reservado en Pages) para que
# worker.js pueda servir index.html en las rutas del cliente.
binding = "STATIC"
directory = "./dist"

# Only public, non-secret values belong in [vars]. They ship with every
# deployment and are readable in this repository, so server credentials stay in
# the Cloudflare dashboard (Production and Preview separately):
# SUPABASE_SECRET_KEY / SUPABASE_SERVICE_ROLE_KEY and, optionally, SUPABASE_URL.
#
# SUPABASE_PUBLISHABLE_KEY is a Supabase publishable key (sb_publishable_...):
# Supabase designs it to be exposed, and RLS is what protects the data. Keeping
# it here means Git-driven builds get the same configuration as manual ones.
#
# compatibility_date >= 2025-04-01 makes Cloudflare populate process.env with
# the bindings/secrets, which is what the existing API layer reads.
#
# APP_ORIGIN is only the fallback for the password-recovery link: the API uses
# the request's own origin first, so workers.dev, pages.dev, a custom domain and
# Vercel all work without editing this file. Supabase still has to allowlist the
# origin in Authentication -> URL Configuration.
[vars]
APP_ORIGIN = "https://drakotrack.pages.dev"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tJD8FwSnZjApRyQul4TxUw_r4_TXTc-"
